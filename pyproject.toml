[project]
name = "tspfold"
version = "0.1.0"
description = "Forward-pass tensor+sequence parallelism (TSP) attention and gated-MLP blocks vs. 2-way tensor parallelism"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.14.1",
    "numpy>=2.1",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9"]
cudnn = ["nvidia-cudnn-frontend==1.23.0; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Lock only the platforms this project runs on: Linux GPU hosts and Apple-silicon dev machines.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Linux hosts take the CUDA 12.6 build (works with drivers >= 525 and Volta..Hopper GPUs).
# For Blackwell GPUs or drivers >= 580, switch the URL to .../whl/cu130 and re-run `uv lock`.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "distributed: spawns multi-process (gloo or nccl) process groups",
    "gpu: requires CUDA devices",
]
